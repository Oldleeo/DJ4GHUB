name: Source checks and Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Audit public source
        shell: pwsh
        run: ./scripts/audit-public.ps1
      - name: Check documentation assets and links
        run: node scripts/check-docs.cjs
      - name: Test and build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build Windows installer and portable ZIP
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Verify install, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Upload installer diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: installer-smoke-logs
          path: artifacts/installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: windows-installers
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./cmd/dj4ghub-relay
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/dj4ghub-relay ./cmd/dj4ghub-relay
      - run: docker compose -f deploy/selfhost/compose.yaml --env-file deploy/selfhost/.env.example config --quiet
      - run: docker build -f deploy/selfhost/Dockerfile -t dj4ghub-relay:ci .
